[project]
name = "showwork"
version = "0.1.0"
description = "A small decision agent that shows its work: read-only, sourced, repeatable, honest about thin evidence, human-reviewed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayomide Agbaje" }]
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
